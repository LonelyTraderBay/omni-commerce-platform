          required:
            - shippingVnd
            - adSpendVnd
            - netProfitVnd
          properties:
            shippingVnd:
              type: string
              pattern: '^[0-9]+$'
              description: >-
                Shipping cost booked on the orders in this bucket
                (orders.shipping_fee_vnd) as a bigint string.
            adSpendVnd:
              type: string
              pattern: '^[0-9]+$'
              description: Imported ad spend expense as a bigint string.
            netProfitVnd:
              type: string
              pattern: '^-?[0-9]+$'
              description: >-
                grossProfitVnd minus shippingVnd minus adSpendVnd, as a bigint
                string.
