          type: string
          pattern: '^-?[0-9]+$'
          description: revenueVnd minus cogsVnd as a bigint string.
        orderCount:
          type: integer
          minimum: 0
    PnlProfitAggregate:
      allOf:
        - $ref: '#/components/schemas/PnlMoneyAggregate'
