          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    CodExpectation:
      type: object
      required:
        - id
        - orgId
        - orderId
        - expectedVnd
        - collectedVnd
        - deltaVnd
        - status
        - createdAt
        - order
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        expectedVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Expected COD VND from orders.total_vnd as a bigint string.
        collectedVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Sum of COD collection events as a bigint string.
        deltaVnd:
          type: string
          pattern: '^-?[0-9]+$'
          description: collectedVnd minus expectedVnd as a bigint string.
        status:
          $ref: '#/components/schemas/CodExpectationStatus'
        createdAt:
          type: string
          format: date-time
        order:
          anyOf:
            - $ref: '#/components/schemas/CodOrderSummary'
            - type: 'null'
    CodCollection:
      type: object
      required:
        - id
        - orgId
        - orderId
        - amountVnd
        - collectedAt
        - source
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        amountVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
        collectedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/CodCollectionSource'
        note:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    CodDiscrepancy:
      type: object
      required:
        - id
        - orgId
        - orderId
        - expectedVnd
        - collectedVnd
        - deltaVnd
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        expectedVnd:
          type: string
          pattern: '^[0-9]+$'
        collectedVnd:
          type: string
          pattern: '^[0-9]+$'
        deltaVnd:
          type: string
          pattern: '^-?[0-9]+$'
          description: collectedVnd minus expectedVnd as a bigint string.
        status:
          $ref: '#/components/schemas/CodDiscrepancyStatus'
        note:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
    CodReportSummary:
      type: object
      required:
        - openCount
        - discrepancyCount
        - expectedVnd
        - collectedVnd
        - deltaVnd
      properties:
        openCount:
          type: integer
          minimum: 0
        discrepancyCount:
          type: integer
          minimum: 0
        expectedVnd:
          type: string
          pattern: '^[0-9]+$'
        collectedVnd:
          type: string
          pattern: '^[0-9]+$'
        deltaVnd:
          type: string
          pattern: '^-?[0-9]+$'
    CodReportResponse:
      type: object
      required:
        - summary
        - expectations
        - expectationsTruncated
        - discrepancies
        - discrepanciesTruncated
      properties:
        summary:
          $ref: '#/components/schemas/CodReportSummary'
          description: >-
            Totals aggregated over every open/discrepant expectation in the org,
            independent of the row caps on the two lists below.
        expectations:
          type: array
          items:
            $ref: '#/components/schemas/CodExpectation'
          description: Newest 100 open or discrepant expectations.
        expectationsTruncated:
          type: boolean
          description: >-
            True when more open/discrepant expectations exist than the
            `expectations` list returned. `summary` stays complete either way.
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/CodDiscrepancy'
          description: Newest 100 open discrepancies.
        discrepanciesTruncated:
          type: boolean
          description: >-
            True when more open discrepancies exist than the `discrepancies`
            list returned. `summary.discrepancyCount` stays complete either way.
    RecordCodCollectionRequest:
      type: object
      required:
        - orderId
        - amountVnd
      properties:
        orderId:
          type: string
          format: uuid
        amountVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
        collectedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/CodCollectionSource'
          default: manual
        note:
          type: string
          maxLength: 500
    CodCollectionEnvelope:
      type: object
      required:
        - collection
      properties:
        collection:
          $ref: '#/components/schemas/CodCollection'
    ReconcileCodOrderRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          format: uuid
    CodReconcileSummary:
      type: object
      required:
        - expectedVnd
        - collectedVnd
        - deltaVnd
      properties:
        expectedVnd:
          type: string
          pattern: '^[0-9]+$'
        collectedVnd:
          type: string
          pattern: '^[0-9]+$'
        deltaVnd:
          type: string
          pattern: '^-?[0-9]+$'
    CodReconcileResponse:
      type: object
      required:
        - expectation
        - discrepancy
        - summary
      properties:
        expectation:
          $ref: '#/components/schemas/CodExpectation'
        discrepancy:
          anyOf:
            - $ref: '#/components/schemas/CodDiscrepancy'
            - type: 'null'
        summary:
          $ref: '#/components/schemas/CodReconcileSummary'
    ReconcileCodBatchRequest:
      type: object
      properties:
        orderIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
    CodReconcileBatchResponse:
      type: object
      required:
        - reconciled
        - results
        - remaining
        - hasMore
      properties:
        reconciled:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/CodReconcileResponse'
        remaining:
          type: integer
          minimum: 0
          description: >-
            Reconcilable open/discrepancy COD expectations left after this
            call, beyond the ones just reconciled. Always `0` when the
            request named `orderIds` explicitly. When the request omitted
            `orderIds` (reconcile all open COD), at most 100 are reconciled
            per call; call the endpoint again with no `orderIds` to continue
            until `remaining` is `0`.
        hasMore:
          type: boolean
          description: >-
            True when `remaining` is greater than zero. `reconciled` used to
            silently cap at 100 with nothing distinguishing "fully done" from
            "there are more"; this makes that state explicit.
