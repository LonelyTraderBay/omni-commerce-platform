openapi: 3.1.0
info:
  title: Omni Commerce API
  version: 0.0.0
  description: Contract stub — full schema and codegen in a later task.
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /v1/auth/sso/status:
    get:
      summary: Enterprise SSO availability placeholder
      responses:
        '200':
          description: SSO status
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                  - etaDays
                properties:
                  available:
                    type: boolean
                    example: false
                  etaDays:
                    type: integer
                    example: 90
  /v1/orgs:
    get:
      summary: List orgs for current user
      responses:
        '200':
          description: OK
    post:
      summary: Create org
      responses:
        '201':
          description: Created
  /v1/orgs/me/export:
    post:
      summary: Export a practical PDPA JSON bundle for the current org
      responses:
        '200':
          description: Export bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaExportBundle'
        '403':
          description: Owner permission required
  /v1/orgs/me/delete-request:
    post:
      summary: Record a pending PDPA delete/anonymize request for the current org
      responses:
        '202':
          description: Delete request recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaDeleteRequestResponse'
        '403':
          description: Owner permission required
  /v1/orgs/{orgId}/invites:
    get:
      summary: List pending membership invites for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pending invites
          content:
            application/json:
              schema:
                type: object
                required:
                  - invites
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/MembershipInvite'
        '403':
          description: members.invite permission required
    post:
      summary: Create a membership invite (returns raw token once)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [owner, cskh, kho]
      responses:
        '201':
          description: Invite created; token returned once for local/Mailpit copy
          content:
            application/json:
              schema:
                type: object
                required:
                  - invite
                  - token
                properties:
                  invite:
                    $ref: '#/components/schemas/MembershipInvite'
                  token:
                    type: string
                    description: One-time raw invite token (hash stored server-side)
        '403':
          description: members.invite permission required
  /v1/invites/accept:
    post:
      summary: Accept a membership invite by token (JWT required; no X-Org-Id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 128
      responses:
        '200':
          description: Membership created; invite invalidated
          content:
            application/json:
              schema:
                type: object
                required:
                  - membership
                  - invite
                properties:
                  membership:
                    type: object
                    required: [id, orgId, userId, role]
                    properties:
                      id:
                        type: string
                        format: uuid
                      orgId:
                        type: string
                        format: uuid
                      userId:
                        type: string
                        format: uuid
                      role:
                        type: string
                        enum: [owner, cskh, kho]
                  invite:
                    $ref: '#/components/schemas/MembershipInvite'
        '400':
          description: Expired invite or missing user email
        '403':
          description: Signed-in email does not match invite
        '404':
          description: Invite not found or already accepted
  /v1/channels:
    get:
      summary: List channel connections for current org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChannelConnectionsResponse'
  /v1/channels/meta/oauth-url:
    get:
      summary: Build Meta OAuth connect URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
  /v1/channels/meta/complete:
    post:
      summary: Complete Meta OAuth and connect pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - state
              properties:
                code:
                  type: string
                state:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaConnectResponse'
  /v1/channels/zalo/connect:
    post:
      summary: Connect a Zalo Official Account using an existing access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectZaloRequest'
      responses:
        '201':
          description: Zalo OA connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnectionEnvelope'
  /v1/channels/zalo/webhook:
    post:
      summary: Receive Zalo OA inbound webhook and enqueue processing stub
      parameters:
        - name: x-zalo-webhook-secret
          in: header
          required: false
          schema:
            type: string
          description: Required only when ZALO_WEBHOOK_SECRET is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Receipt recorded and outbox event enqueued when OA maps to an org
  /v1/channels/{id}/revoke:
    post:
      summary: Revoke a channel connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Revoked
  /v1/shipping/connections:
    get:
      summary: List carrier connections for current org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCarrierConnectionsResponse'
    post:
      summary: Upsert one carrier connection for current org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCarrierConnectionRequest'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierConnectionEnvelope'
  /v1/shipping/shipments:
    get:
      summary: List shipments for an order
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListShipmentsResponse'
    post:
      summary: Create a shipment for a confirmed or shipped order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShipmentResponse'
        '400':
          description: Carrier not configured, disabled, or invalid order status
  /v1/cod/report:
    get:
      summary: List open COD expectations, open discrepancies, and summary totals
      responses:
        '200':
          description: COD reconciliation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodReportResponse'
  /v1/cod/collections:
    post:
      summary: Record a COD collection event for one order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCodCollectionRequest'
      responses:
        '201':
          description: COD collection recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodCollectionEnvelope'
        '404':
          description: COD expectation not found for order
  /v1/cod/reconcile:
    post:
      summary: Reconcile one COD order expected amount against collected events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileCodOrderRequest'
      responses:
        '200':
          description: COD order reconciled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodReconcileResponse'
        '404':
          description: COD expectation not found for order
  /v1/cod/reconcile/batch:
    post:
      summary: Reconcile a batch of COD orders, or all open COD expectations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileCodBatchRequest'
      responses:
        '200':
          description: COD batch reconciled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodReconcileBatchResponse'
  /v1/pnl/summary:
    get:
      summary: Gross profit summary by sold day for shipped/done orders
      parameters:
        - name: from
          in: query
          schema:
            type: string
            description: Inclusive YYYY-MM-DD or ISO date-time.
        - name: to
          in: query
          schema:
            type: string
            description: Inclusive YYYY-MM-DD or ISO date-time.
      responses:
        '200':
          description: P&L summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlSummaryResponse'
  /v1/pnl/by-sku:
    get:
      summary: Gross profit by SKU for shipped/done orders
      parameters:
        - name: from
          in: query
          schema:
            type: string
            description: Inclusive YYYY-MM-DD or ISO date-time.
        - name: to
          in: query
          schema:
            type: string
            description: Inclusive YYYY-MM-DD or ISO date-time.
      responses:
        '200':
          description: P&L by SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlBySkuResponse'
  /v1/ad-spend/import:
    post:
      summary: Import ad spend rows from CSV text or JSON batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdSpendImportRequest'
      responses:
        '201':
          description: Ad spend imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSpendImportResponse'
        '400':
          description: Invalid CSV, JSON rows, date, source, or money value
  /v1/ad-spend:
    get:
      summary: List ad spend rows for current org
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Ad spend rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSpendListResponse'
  /v1/ad-spend/summary:
    get:
      summary: Summarize ad spend by day for current org
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Ad spend daily summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSpendSummaryResponse'
  /v1/attribution/summary:
    get:
      summary: Summarize order attribution by utm_source for current org
      description: MVP first-touch-enough report using attribution fields stored on orders at create time. No CPC metric is calculated.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Attribution source summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionSummaryResponse'
  /v1/advisor/suggest:
    post:
      summary: Get advise-only owner suggestions
      description: Returns human-reviewed suggestions only. This endpoint never posts to Meta, buys ads, or mutates business tables directly.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisorSuggestRequest'
      responses:
        '200':
          description: Advisor suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorSuggestResponse'
        '503':
          description: Advisor disabled by AI kill switch
  /v1/billing/plan:
    get:
      summary: Current billing plan, status, and entitlements for current org
      responses:
        '200':
          description: Billing plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlanResponse'
  /v1/billing/usage:
    get:
      summary: Simple billing usage meters for current org
      responses:
        '200':
          description: Billing usage meters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageResponse'
  /v1/billing/invoices:
    get:
      summary: List manual billing invoices for current org
      responses:
        '200':
          description: Billing invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoicesResponse'
  /v1/inventory/movements:
    get:
      summary: List stock movements for current org
      parameters:
        - name: variantId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: OK
  /v1/inventory/low-stock:
    get:
      summary: List variants at or below low-stock threshold
      parameters:
        - name: threshold
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: OK
  /v1/inventory/adjust:
    post:
      summary: Adjust variant stock and write ledger row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - variantId
                - qtyDelta
              properties:
                variantId:
                  type: string
                  format: uuid
                qtyDelta:
                  type: integer
                reason:
                  type: string
                movementType:
                  type: string
                  enum:
                    - adjust
                    - inbound
                    - outbound
      responses:
        '201':
          description: Adjusted
        '200':
          description: Adjusted
  /v1/warehouses:
    get:
      summary: List warehouses for current org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWarehousesResponse'
    post:
      summary: Create a warehouse for current org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarehouseRequest'
      responses:
        '201':
          description: Warehouse created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseEnvelope'
        '400':
          description: Invalid warehouse input or duplicate warehouse code
  /v1/warehouses/{warehouseId}/stock:
    get:
      summary: List variant stock for one warehouse
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseStockResponse'
        '404':
          description: Warehouse not found for current org
  /v1/warehouses/transfer:
    post:
      summary: Transfer stock between two warehouses and write ledger rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferStockRequest'
      responses:
        '201':
          description: Transfer posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferStockResponse'
        '400':
          description: Invalid quantity, same warehouse, or insufficient stock
        '404':
          description: Warehouse or variant not found for current org
  /v1/suppliers:
    get:
      summary: List suppliers for current org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSuppliersResponse'
    post:
      summary: Create a supplier for current org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierRequest'
      responses:
        '201':
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierEnvelope'
  /v1/purchase-orders:
    get:
      summary: List purchase orders for current org
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PurchaseOrderStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPurchaseOrdersResponse'
    post:
      summary: Create a purchase order with line items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderRequest'
      responses:
        '201':
          description: Purchase order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderEnvelope'
  /v1/purchase-orders/{purchaseOrderId}/status:
    patch:
      summary: Mark a purchase order ordered or cancelled
      parameters:
        - name: purchaseOrderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePurchaseOrderStatusRequest'
      responses:
        '200':
          description: Purchase order status updated
  /v1/purchase-orders/{purchaseOrderId}/receive:
    post:
      summary: Receive a purchase order into a warehouse and post inbound stock ledger rows
      parameters:
        - name: purchaseOrderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivePurchaseOrderRequest'
      responses:
        '200':
          description: Purchase order received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivePurchaseOrderResponse'
  /v1/einvoice/jobs:
    get:
      summary: List e-invoice jobs for current org
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EinvoiceJobStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEinvoiceJobsResponse'
  /v1/einvoice/issue:
    post:
      summary: Issue an e-invoice for a done order (stub or http_sandbox)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueEinvoiceRequest'
      responses:
        '201':
          description: E-invoice job created and attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinvoiceJobEnvelope'
  /v1/accounting/export:
    get:
      summary: Export journal-like accounting CSV lines
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - csv
      responses:
        '200':
          description: CSV with date, account_hint, amount_vnd, ref columns
          content:
            text/csv:
              schema:
                type: string
  /v1/catalog/products:
    get:
      summary: List products for current org
      responses:
        '200':
          description: OK
    post:
      summary: Create product with optional variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type:
                    - string
                    - 'null'
                status:
                  type: string
                  enum:
                    - active
                    - archived
                attrs:
                  type: object
                  additionalProperties: true
                variants:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductVariantWrite'
      responses:
        '201':
          description: Created
  /v1/catalog/products/{productId}:
    get:
      summary: Get product with variants
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: OK
    patch:
      summary: Update product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft-delete product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Deleted
  /v1/catalog/products/{productId}/variants:
    post:
      summary: Create product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariantWrite'
      responses:
        '201':
          description: Created
  /v1/catalog/products/{productId}/variants/{variantId}:
    patch:
      summary: Update product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: Deleted
  /v1/orders:
    get:
      summary: List orders for current org
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
    post:
      summary: Create a staff draft order
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created, or confirmed when org settings auto_confirm is true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request or insufficient stock during auto-confirm
  /v1/orders/{orderId}:
    get:
      summary: Get one order with items
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
  /v1/orders/{orderId}/confirm:
    post:
      summary: Confirm an order and atomically decrement stock
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order status or insufficient stock
  /v1/orders/{orderId}/cancel:
    post:
      summary: Cancel an order; confirmed unshipped orders restore stock
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /v1/orders/{orderId}/ship:
    post:
      summary: Mark a confirmed order as shipped
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Shipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /v1/orders/{orderId}/done:
    post:
      summary: Mark a shipped order as done, unblocking e-invoice issuance
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order status
  /v1/orders/{orderId}/return:
    post:
      summary: Mark a shipped or done order as returned and optionally restock items
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnOrderRequest'
      responses:
        '200':
          description: Returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order status
  /v1/orders/export:
    get:
      summary: Export orders for current org as xlsx, csv, or pdf
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum:
              - csv
              - xlsx
              - pdf
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Export file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid query
  /v1/inbox/conversations:
    get:
      summary: List inbox conversations for current org
      responses:
        '200':
          description: OK
  /v1/inbox/conversations/{id}/messages:
    get:
      summary: List inbox messages for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
    post:
      summary: Send a manual staff reply message in an inbox conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: Message sent
        '400':
          description: Invalid request body, unsupported channel (Zalo), or channel connection inactive
  /v1/inbox/conversations/{id}/takeover:
    post:
      summary: Pause bot and take over an inbox conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Taken over
  /v1/inbox/conversations/{id}/resume:
    post:
      summary: Resume bot after human takeover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bot resumed
  /v1/webhooks/meta:
    get:
      summary: Verify Meta webhook subscription
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plain text challenge
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Invalid verify token
    post:
      summary: Ingest Meta webhook events
      parameters:
        - name: x-hub-signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        '401':
          description: Invalid signature
  /ops/v1/orgs:
    get:
      summary: List orgs (platform admin)
      responses:
        '200':
          description: OK
  /ops/v1/orgs/{orgId}/plan:
    patch:
      summary: Update organization plan and sync entitlements (platform admin)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgPlanRequest'
      responses:
        '200':
          description: Organization plan updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrgPlanResponse'
        '400':
          description: Invalid plan or org id
        '403':
          description: Platform admin required
        '404':
          description: Organization not found
  /ops/v1/orgs/{orgId}/invoices:
    post:
      summary: Issue a manual billing invoice for an organization (platform admin)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBillingInvoiceRequest'
      responses:
        '201':
          description: Billing invoice issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBillingInvoiceResponse'
        '400':
          description: Invalid invoice or org id
        '403':
          description: Platform admin required
        '404':
          description: Organization not found
  /internal/v1/ai/health:
    get:
      summary: Proxy AI health (service key)
      responses:
        '200':
          description: OK
  /internal/v1/ai/runs:
    post:
      summary: Persist an AI run after Core receives an AI response (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteAiRunRequest'
      responses:
        '201':
          description: AI run written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteAiRunResponse'
        '400':
          description: Invalid request or model not allowed
        '401':
          description: Invalid service key
  /internal/v1/tools/get-product:
    post:
      summary: Get one product with variants for AI tooling (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGetProductRequest'
      responses:
        '201':
          description: Product returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGetProductResponse'
        '401':
          description: Invalid service key
        '404':
          description: Product not found for organization
  /internal/v1/tools/create-draft-order:
    post:
      summary: Create a draft order from catalog variants for AI tooling (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiCreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCreateDraftOrderResponse'
        '400':
          description: Invalid request or draft total over AI maximum
        '401':
          description: Invalid service key
        '404':
          description: Organization, product, contact, or conversation not found
  /internal/v1/knowledge/chunks:
    post:
      summary: Atomically replace RAG chunks for one knowledge source (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceKnowledgeChunksRequest'
      responses:
        '201':
          description: Chunks replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceKnowledgeChunksResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid service key
        '404':
          description: Knowledge source not found for organization
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    MembershipInvite:
      type: object
      required:
        - id
        - orgId
        - email
        - role
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, cskh, kho]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
    ChannelProvider:
      type: string
      enum:
        - meta_page
        - meta_ig
        - zalo_oa
    ChannelConnection:
      type: object
      required:
        - id
        - provider
        - externalPageId
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/ChannelProvider'
        externalPageId:
          type: string
        status:
          type: string
          enum:
            - active
            - needs_reauth
            - revoked
        createdAt:
          type: string
          format: date-time
    ListChannelConnectionsResponse:
      type: array
      items:
        $ref: '#/components/schemas/ChannelConnection'
    MetaConnectResponse:
      type: object
      required:
        - connections
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ChannelConnection'
    ConnectZaloRequest:
      type: object
      required:
        - oaId
        - accessToken
      properties:
        oaId:
          type: string
        accessToken:
          type: string
          writeOnly: true
        displayName:
          type: string
    ChannelConnectionEnvelope:
      type: object
      required:
        - connection
      properties:
        connection:
          $ref: '#/components/schemas/ChannelConnection'
    PlanSlug:
      type: string
      enum:
        - free
        - pilot
        - starter
        - enterprise
    Entitlements:
      type: object
      required:
        - orgId
        - maxPages
        - aiMonthlyTokenLimit
        - autoConfirmAllowed
        - updatedAt
      properties:
        orgId:
          type: string
          format: uuid
        maxPages:
          type: integer
          minimum: 0
        aiMonthlyTokenLimit:
          type: integer
          minimum: 0
        autoConfirmAllowed:
          type: boolean
        autoConfirmBlockedReason:
          type:
            - string
            - 'null'
        updatedAt:
          type: string
          format: date-time
    BillingStatus:
      type: string
      enum:
        - active
        - past_due
        - suspended
    BillingPlanResponse:
      type: object
      required:
        - plan
        - billingStatus
        - billingCustomerEmail
        - planRenewsAt
        - entitlements
        - dunning
      properties:
        plan:
          $ref: '#/components/schemas/PlanSlug'
        billingStatus:
          $ref: '#/components/schemas/BillingStatus'
        billingCustomerEmail:
          type:
            - string
            - 'null'
          format: email
        planRenewsAt:
          type:
            - string
            - 'null'
          format: date-time
        entitlements:
          $ref: '#/components/schemas/Entitlements'
        dunning:
          type: object
          required:
            - autoConfirmBlocked
            - reason
          properties:
            autoConfirmBlocked:
              type: boolean
            reason:
              type:
                - string
                - 'null'
          description: past_due/suspended blocks auto-confirm but does not disable reads.
    BillingUsageResponse:
      type: object
      required:
        - periodStart
        - pagesConnectedCount
        - aiTokensMonth
        - ordersCountMonth
      properties:
        periodStart:
          type: string
          format: date-time
        pagesConnectedCount:
          type: integer
          minimum: 0
        aiTokensMonth:
          type: integer
          minimum: 0
        ordersCountMonth:
          type: integer
          minimum: 0
    BillingInvoice:
      type: object
      required:
        - id
        - orgId
        - periodStart
        - periodEnd
        - amountVnd
        - status
        - issuedAt
        - note
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        amountVnd:
          type: string
          pattern: ^[0-9]+$
        status:
          type: string
          enum:
            - draft
            - issued
            - paid
            - void
        issuedAt:
          type:
            - string
            - 'null'
          format: date-time
        note:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    BillingInvoicesResponse:
      type: object
      required:
        - invoices
      properties:
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoice'
    IssueBillingInvoiceRequest:
      type: object
      required:
        - periodStart
        - periodEnd
        - amountVnd
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        amountVnd:
          oneOf:
            - type: string
              pattern: ^[0-9]+$
            - type: integer
              minimum: 0
        note:
          type: string
          maxLength: 1000
      additionalProperties: false
    IssueBillingInvoiceResponse:
      type: object
      required:
        - invoice
      properties:
        invoice:
          $ref: '#/components/schemas/BillingInvoice'
    UpdateOrgPlanRequest:
      type: object
      required:
        - plan
      properties:
        plan:
          $ref: '#/components/schemas/PlanSlug'
      additionalProperties: false
    UpdateOrgPlanResponse:
      type: object
      required:
        - organization
        - entitlements
      properties:
        organization:
          type: object
          additionalProperties: true
        entitlements:
          $ref: '#/components/schemas/Entitlements'
    PdpaExportBundle:
      type: object
      required:
        - exportedAt
        - orgId
        - generatedByUserId
        - organization
        - memberships
        - contacts
        - conversations
        - orders
      properties:
        exportedAt:
          type: string
          format: date-time
        orgId:
          type: string
          format: uuid
        generatedByUserId:
          type: string
          format: uuid
        organization:
          type: object
          additionalProperties: true
        memberships:
          type: array
          items:
            type: object
            additionalProperties: true
        contacts:
          type: array
          items:
            type: object
            additionalProperties: true
        conversations:
          type: array
          description: Conversation summaries only; message bodies are excluded.
          items:
            type: object
            additionalProperties: true
        orders:
          type: array
          items:
            type: object
            additionalProperties: true
    PdpaDeleteRequest:
      type: object
      required:
        - orgId
        - status
        - requestedByUserId
        - requestedAt
      properties:
        orgId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
        requestedByUserId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
    PdpaDeleteRequestResponse:
      type: object
      required:
        - deleteRequest
      properties:
        deleteRequest:
          $ref: '#/components/schemas/PdpaDeleteRequest'
    KnowledgeChunkWrite:
      type: object
      required:
        - chunkIndex
        - content
        - contentHash
        - embedding
      properties:
        chunkIndex:
          type: integer
          minimum: 0
        content:
          type: string
          minLength: 1
          maxLength: 20000
        contentHash:
          type: string
          minLength: 1
          maxLength: 128
        embedding:
          type: array
          minItems: 768
          maxItems: 768
          items:
            type: number
            format: double
    ReplaceKnowledgeChunksRequest:
      type: object
      required:
        - orgId
        - sourceType
        - sourceId
        - chunks
      properties:
        orgId:
          type: string
          format: uuid
        sourceType:
          type: string
          enum:
            - product
            - faq
            - policy
        sourceId:
          type: string
          format: uuid
        chunks:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/KnowledgeChunkWrite'
    ReplaceKnowledgeChunksResponse:
      type: object
      required:
        - ok
        - deletedOld
        - inserted
      properties:
        ok:
          type: boolean
        deletedOld:
          type: boolean
        inserted:
          type: integer
          minimum: 0
    ProductVariantWrite:
      type: object
      required:
        - sku
        - title
        - priceVnd
      properties:
        sku:
          type: string
        title:
          type: string
        priceVnd:
          oneOf:
            - type: string
              pattern: '^[0-9]+$'
            - type: integer
              format: int64
          description: Whole VND amount; floats are not accepted.
        stockQty:
          type: integer
          minimum: 0
        cogsVnd:
          oneOf:
            - type: string
              pattern: '^[0-9]+$'
            - type: integer
              format: int64
          description: Whole per-unit COGS VND amount; floats are not accepted.
        attrs:
          type: object
          additionalProperties: true
    WarehouseProductVariant:
      type: object
      required:
        - id
        - orgId
        - productId
        - sku
        - title
        - priceVnd
        - stockQty
        - cogsVnd
        - attrs
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        title:
          type: string
        priceVnd:
          type: string
          pattern: '^[0-9]+$'
        stockQty:
          type: integer
          minimum: 0
        cogsVnd:
          type: string
          pattern: '^[0-9]+$'
        attrs:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Warehouse:
      type: object
      required:
        - id
        - orgId
        - name
        - code
        - isDefault
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
    WarehouseEnvelope:
      type: object
      required:
        - warehouse
      properties:
        warehouse:
          $ref: '#/components/schemas/Warehouse'
    ListWarehousesResponse:
      type: object
      required:
        - warehouses
      properties:
        warehouses:
          type: array
          items:
            $ref: '#/components/schemas/Warehouse'
    CreateWarehouseRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          type: string
          minLength: 1
          maxLength: 32
        isDefault:
          type: boolean
          default: false
      additionalProperties: false
    WarehouseStock:
      type: object
      required:
        - orgId
        - warehouseId
        - variantId
        - qty
        - variant
      properties:
        orgId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 0
        variant:
          oneOf:
            - $ref: '#/components/schemas/WarehouseProductVariant'
            - type: 'null'
    WarehouseStockResponse:
      type: object
      required:
        - warehouse
        - stock
      properties:
        warehouse:
          $ref: '#/components/schemas/Warehouse'
        stock:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseStock'
    TransferStockRequest:
      type: object
      required:
        - fromWarehouseId
        - toWarehouseId
        - variantId
        - qty
      properties:
        fromWarehouseId:
          type: string
          format: uuid
        toWarehouseId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
      additionalProperties: false
    TransferStockSide:
      type: object
      required:
        - warehouseId
        - variantId
        - qty
      properties:
        warehouseId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 0
    WarehouseStockMovement:
      type: object
      required:
        - id
        - orgId
        - warehouseId
        - variantId
        - movementType
        - qtyDelta
        - stockAfter
        - orderId
        - reason
        - actorUserId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        warehouseId:
          type:
            - string
            - 'null'
          format: uuid
        variantId:
          type: string
          format: uuid
        movementType:
          type: string
          enum:
            - confirm
            - cancel_restore
            - return_restock
            - adjust
            - inbound
            - outbound
            - transfer_out
            - transfer_in
        qtyDelta:
          type: integer
        stockAfter:
          type: integer
          minimum: 0
        orderId:
          type:
            - string
            - 'null'
          format: uuid
        reason:
          type:
            - string
            - 'null'
        actorUserId:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
    TransferStockResponse:
      type: object
      required:
        - variant
        - fromStock
        - toStock
        - movements
      properties:
        variant:
          $ref: '#/components/schemas/WarehouseProductVariant'
        fromStock:
