[project]
name = "omni-ai"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "sentry-sdk>=2.0.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
