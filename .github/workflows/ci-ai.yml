name: CI AI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/apps/ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python ../../tests/eval/run_stub.py
