name: Migrate Check

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start --workdir backend/database
      - run: supabase db reset --workdir backend/database
