name: CI API

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      # Local Supabase demo JWT pair (public; same as `supabase start` defaults).
      # Needed since some backend/apps/api/src/**/*.integration.spec.ts files connect to
      # a real local Postgres (e.g. the multi-warehouse stock-total regression
      # tests) rather than a mocked Supabase client.
      SUPABASE_URL: http://127.0.0.1:54721
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start --workdir backend/database
      - run: supabase db reset --workdir backend/database
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test --filter=@omni/api...
