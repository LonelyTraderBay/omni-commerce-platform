name: Staging Migrate

# Runs only when repo secrets are configured. Skips cleanly otherwise.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/database/supabase/migrations/**'
      - '.github/workflows/staging-migrate.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$STAGING_PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Missing SUPABASE_ACCESS_TOKEN or STAGING_PROJECT_REF — skip remote staging migrate."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: latest

      - name: Link and push
        if: steps.secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
        run: |
          supabase link --project-ref "$STAGING_PROJECT_REF" --workdir backend/database
          supabase db push --workdir backend/database
