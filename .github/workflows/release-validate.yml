name: Release Validate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate SemVer tag and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be SemVer, for example v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release tag $RELEASE_TAG does not point to a commit reachable from origin/main."
            exit 1
          fi

          echo "Validated $RELEASE_TAG at $RELEASE_SHA from main."
